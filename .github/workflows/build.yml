name: Build Android APKs

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 34 SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Build debug APKs
        run: gradle :phone:assembleDebug :watch:assembleDebug

      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: Phone-APK
          path: phone/build/outputs/apk/debug/phone-debug.apk
          if-no-files-found: error

      - name: Upload watch APK
        uses: actions/upload-artifact@v4
        with:
          name: Watch-APK
          path: watch/build/outputs/apk/debug/watch-debug.apk
          if-no-files-found: error
